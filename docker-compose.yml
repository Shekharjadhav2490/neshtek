services:
  backend:
    build: ./backend
    container_name: neshtek-monitor-backend
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: neshtek-monitor-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
